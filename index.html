<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truck Driver Trip</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  margin:0;
  padding:15px;
}

.container{
  max-width:600px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  color:#1677ff;
}

h2{
  color:#333;
}

input,select,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#1677ff;
  color:white;
  border:0;
  font-weight:bold;
}

.search{
  background:#111827;
}

.driver{
  border:1px solid #ddd;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.driver h3{
  margin-top:0;
}

.call{
  display:inline-block;
  background:#16a34a;
  color:white;
  padding:10px;
  border-radius:7px;
  text-decoration:none;
  margin-top:7px;
  margin-right:5px;
}

.whatsapp{
  display:inline-block;
  background:#25D366;
  color:white;
  padding:10px;
  border-radius:7px;
  text-decoration:none;
  margin-top:7px;
}

.message{
  text-align:center;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚚 Truck Driver Trip</h1>

<!-- DRIVER REGISTRATION -->

<div class="card">

<h2>👤 ড্রাইভার রেজিস্ট্রেশন</h2>

<input id="name" placeholder="ড্রাইভারের নাম">

<input id="phone" placeholder="মোবাইল নম্বর">

<input id="truck_number" placeholder="ট্রাক নম্বর">

<select id="truck_type">

<option value="">ট্রাকের ধরন নির্বাচন করুন</option>

<option value="ট্রাক">ট্রাক</option>

<option value="কভার্ড ভ্যান">কভার্ড ভ্যান</option>

<option value="ডাম্প ট্রাক">ডাম্প ট্রাক</option>

<option value="পিকআপ">পিকআপ</option>

</select>

<input id="location" placeholder="বর্তমান অবস্থান">

<input id="rent" type="number" placeholder="ভাড়া (টাকা)">

<button onclick="registerDriver()">
ড্রাইভার রেজিস্টার করুন
</button>

<div id="message" class="message"></div>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 ড্রাইভার খুঁজুন</h2>

<input id="search"
placeholder="নাম, এলাকা বা ট্রাক নম্বর লিখুন">

<select id="searchType">

<option value="">সব ধরনের ট্রাক</option>

<option value="ট্রাক">ট্রাক</option>

<option value="কভার্ড ভ্যান">কভার্ড ভ্যান</option>

<option value="ডাম্প ট্রাক">ডাম্প ট্রাক</option>

<option value="পিকআপ">পিকআপ</option>

</select>

<button class="search" onclick="searchDrivers()">
🔎 ড্রাইভার খুঁজুন
</button>

<div id="drivers"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://qstotlvpbygjsirqrpfj.supabase.co";

const SUPABASE_KEY =
  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdG90bHZwYnlnanNpcnFycGZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzU1MDksImV4cCI6MjEwNjQ1MTUwOX0.zZ08CnnMDzKJ4aHPvhyShxsu0mezeTsOAtnxcBVS-9U
"আপনার_আগের_legacy_anon_key_এখানে_যেটি_দিয়েছিলেন_সেটি_বসাবেন";


async function registerDriver(){

const name =
document.getElementById("name").value.trim();

const phone =
document.getElementById("phone").value.trim();

const truck_number =
document.getElementById("truck_number").value.trim();

const truck_type =
document.getElementById("truck_type").value;

const location =
document.getElementById("location").value.trim();

const rent =
document.getElementById("rent").value;


if(!name || !phone || !truck_number){

document.getElementById("message").innerText =
"❌ নাম, মোবাইল ও ট্রাক নম্বর দিন।";

return;

}


const response = await fetch(
`${SUPABASE_URL}/rest/v1/drivers`,
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":`Bearer ${SUPABASE_KEY}`,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},

body:JSON.stringify({

name:name,
phone:phone,
truck_number:truck_number,
truck_type:truck_type,
location:location,
rent:rent,
available:true

})

});


if(response.ok){

document.getElementById("message").innerText =
"✅ ড্রাইভার সফলভাবে রেজিস্টার হয়েছে!";

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("truck_number").value="";
document.getElementById("truck_type").value="";
document.getElementById("location").value="";
document.getElementById("rent").value="";

}else{

const error=await response.text();

document.getElementById("message").innerText =
"❌ Error: "+error;

}

}


/* DRIVER SEARCH */

async function searchDrivers(){

const search =
document.getElementById("search").value.trim();

const type =
document.getElementById("searchType").value;


let url =
`${SUPABASE_URL}/rest/v1/drivers?select=*`;


if(type){

url += `&truck_type=eq.${encodeURIComponent(type)}`;

}


const response =
await fetch(url,{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":`Bearer ${SUPABASE_KEY}`
}
});


if(!response.ok){

document.getElementById("drivers").innerHTML =
"❌ ড্রাইভার লোড করা যায়নি।";

return;

}


let data=await response.json();


if(search){

const s=search.toLowerCase();

data=data.filter(d=>

(d.name||"").toLowerCase().includes(s) ||

(d.location||"").toLowerCase().includes(s) ||

(d.truck_number||"").toLowerCase().includes(s)

);

}


displayDrivers(data);

}


/* SHOW DRIVERS */

function displayDrivers(data){

const box=document.getElementById("drivers");

box.innerHTML="";


if(data.length===0){

box.innerHTML=
"<p>কোনো ড্রাইভার পাওয়া যায়নি।</p>";

return;

}


data.forEach(driver=>{

const phone =
(driver.phone||"").replace(/\D/g,"");


const whatsappNumber =
phone.startsWith("0")
? "88"+phone
: phone;


const div=document.createElement("div");

div.className="driver";


div.innerHTML=`

<h3>🚚 ${escapeHtml(driver.name)}</h3>

<p>📞 ${escapeHtml(driver.phone||"")}</p>

<p>🚛 ট্রাক: ${escapeHtml(driver.truck_number||"")}</p>

<p>🚚 ধরন: ${escapeHtml(driver.truck_type||"")}</p>

<p>📍 অবস্থান: ${escapeHtml(driver.location||"")}</p>

<p>💰 ভাড়া: ${escapeHtml(String(driver.rent||""))} টাকা</p>

<a class="call"
href="tel:${escapeHtml(driver.phone||"")}">
📞 কল
</a>

<a class="whatsapp"
target="_blank"
href="https://wa.me/${whatsappNumber}">
💬 WhatsApp
</a>

`;

box.appendChild(div);

});

}


/* SECURITY */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
